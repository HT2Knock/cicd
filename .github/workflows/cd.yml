name: cd

on:
  push:
    branches:
      - main

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: Running test
        run: go test -v -cover ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1

  deploy:
    name: Deploy
    needs: [tests, lint]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"

      - uses: mscno/setup-goose@v1

      - name: Build Prod
        run: ./scripts/buildprod.sh

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: "Build and submit to GCP"
        run: "gcloud builds submit --tag asia-southeast1-docker.pkg.dev/notely-495210/notely-ar-repo/notely:${{ github.sha }} ."

      - name: "Run the migration"
        run: ./scripts/migrateup.sh

      - name: "Deploy to cloud run"
        run: "gcloud run deploy notely --image asia-southeast1-docker.pkg.dev/notely-495210/notely-ar-repo/notely:${{ github.sha }} --region us-central1 --allow-unauthenticated --project notely-495210 --max-instances=4"
